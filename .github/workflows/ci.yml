name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The OCCT validator (docs/design/geom-core.md §15): our STEP output through
      # occt-wasm, a devDependency of packages/geom only. Its files are kept for the
      # manual Rhino / Fusion / FreeCAD / SolidWorks import matrix
      # (docs/design/step-export.md).
      - run: pnpm --filter @openshaper/geom test:occt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occt-corpus
          path: packages/geom/.occt-corpus/*.step
          if-no-files-found: ignore
      - run: pnpm build

  # Browser tests (P35). Separate from `verify` so a slow or flaky browser run
  # never hides a type or unit failure. `e2e` drives the dev server; `e2e:offline`
  # builds `dist` and is the only check of the service worker / offline promises.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser build must match the installed @playwright/test version.
      - run: pnpm --filter @openshaper/web exec playwright install --with-deps chromium

      - run: pnpm --filter @openshaper/web e2e
      - run: pnpm --filter @openshaper/web e2e:offline

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
